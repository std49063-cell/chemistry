<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chem Game - Sci-Fi</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #020b08;
        color: white;
        overflow: hidden;
    }

    /* พื้นหลังเต็มหน้าจอ */
    .screen {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #063c2d 0%, #021812 35%, #010806 75%);
    }

    /* แสงวงกลมด้านหลัง */
    .glow {
        position: absolute;
        width: 650px;
        height: 650px;
        border-radius: 50%;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 255, 170, 0.08);
        box-shadow:
            0 0 80px rgba(0, 255, 170, 0.2),
            0 0 180px rgba(0, 255, 170, 0.1);
    }

    /* เส้นตาราง Sci-Fi */
    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(0,255,170,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,170,0.06) 1px, transparent 1px);
        background-size: 50px 50px;
        transform: perspective(500px) rotateX(60deg) scale(1.5);
        transform-origin: center bottom;
        opacity: 0.5;
    }

    /* เส้นตกแต่ง */
    .line {
        position: absolute;
        background: #00ffae;
        opacity: 0.5;
        box-shadow: 0 0 10px #00ffae;
    }

    .line1 {
        width: 220px;
        height: 1px;
        top: 20%;
        left: 5%;
    }

    .line2 {
        width: 150px;
        height: 1px;
        bottom: 20%;
        right: 5%;
    }

    /* เนื้อหาหลัก */
    .content {
        position: absolute;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .subtitle {
        color: #00ffae;
        font-size: 15px;
        letter-spacing: 6px;
        margin-bottom: 15px;
        text-shadow: 0 0 15px #00ffae;
    }

    h1 {
        font-size: clamp(60px, 9vw, 130px);
        letter-spacing: 8px;
        margin-bottom: 5px;

        color: white;

        text-shadow:
            0 0 5px #fff,
            0 0 15px #00ffae,
            0 0 35px #00ffae,
            0 0 70px #00ffae;
    }

    .thai-title {
        font-size: 20px;
        letter-spacing: 5px;
        color: #b9ffe9;
        margin-bottom: 45px;
    }

    /* ปุ่ม Login */
    .login-btn {
        width: 250px;
        padding: 18px 30px;

        background: rgba(0, 255, 174, 0.08);

        border: 2px solid #00ffae;
        border-radius: 8px;

        color: #00ffae;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 4px;

        cursor: pointer;

        box-shadow:
            0 0 10px rgba(0,255,174,0.5),
            inset 0 0 10px rgba(0,255,174,0.1);

        transition: 0.3s;
    }

    .login-btn:hover {
        background: #00ffae;
        color: #00130d;

        box-shadow:
            0 0 20px #00ffae,
            0 0 50px #00ffae;

        transform: scale(1.05);
    }

    /* สัญลักษณ์เคมี */
    .chemical {
        position: absolute;
        color: #00ffae;
        font-weight: bold;
        opacity: 0.65;
        text-shadow: 0 0 15px #00ffae;
        animation: float 5s infinite ease-in-out;
    }

    .c1 {
        left: 8%;
        top: 30%;
        font-size: 55px;
    }

    .c2 {
        right: 10%;
        top: 22%;
        font-size: 45px;
    }

    .c3 {
        left: 14%;
        bottom: 17%;
        font-size: 35px;
    }

    .c4 {
        right: 14%;
        bottom: 15%;
        font-size: 55px;
    }

    .c5 {
        left: 25%;
        top: 12%;
        font-size: 25px;
    }

    .c6 {
        right: 27%;
        bottom: 12%;
        font-size: 25px;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(-20px);
        }
    }

    /* โมเลกุลตรงกลาง */
    .molecule {
        position: absolute;
        width: 500px;
        height: 300px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        opacity: 0.25;
    }

    .atom {
        position: absolute;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #00ffae;
        box-shadow:
            0 0 15px #00ffae,
            0 0 35px #00ffae;
    }

    .a1 {
        left: 40%;
        top: 20%;
    }

    .a2 {
        left: 20%;
        top: 60%;
    }

    .a3 {
        left: 65%;
        top: 65%;
    }

    .a4 {
        left: 75%;
        top: 20%;
    }

    .bond {
        position: absolute;
        height: 3px;
        background: #00ffae;
        transform-origin: left center;
        box-shadow: 0 0 10px #00ffae;
    }

    .b1 {
        width: 130px;
        left: 28%;
        top: 48%;
        transform: rotate(25deg);
    }

    .b2 {
        width: 120px;
        left: 43%;
        top: 35%;
        transform: rotate(50deg);
    }

    .b3 {
        width: 100px;
        left: 60%;
        top: 50%;
        transform: rotate(-35deg);
    }

    /* ข้อความมุมจอ */
    .status {
        position: absolute;
        z-index: 20;
        top: 25px;
        left: 30px;

        color: #00ffae;
        font-size: 12px;
        letter-spacing: 2px;
    }

    .status::before {
        content: "● ";
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0.2;
        }
    }

    .version {
        position: absolute;
        bottom: 20px;
        left: 30px;
        color: #4b8976;
        font-size: 11px;
        letter-spacing: 2px;
    }

    .sdg {
        position: absolute;
        bottom: 20px;
        right: 30px;
        color: #4b8976;
        font-size: 11px;
        letter-spacing: 2px;
    }

    /* Responsive */
    @media (max-width: 600px) {

        h1 {
            font-size: 55px;
            letter-spacing: 4px;
        }

        .thai-title {
            font-size: 14px;
        }

        .login-btn {
            width: 210px;
        }

        .chemical {
            opacity: 0.35;
        }
    }
</style>
</head>

<body>

<div class="screen">

    <!-- พื้นหลัง -->
    <div class="grid"></div>
    <div class="glow"></div>

    <!-- เส้นตกแต่ง -->
    <div class="line line1"></div>
    <div class="line line2"></div>

    <!-- สถานะ -->
    <div class="status">
        SYSTEM ONLINE
    </div>

    <!-- สัญลักษณ์เคมี -->
    <div class="chemical c1">H₂</div>
    <div class="chemical c2">O₂</div>
    <div class="chemical c3">Na⁺</div>
    <div class="chemical c4">Cl⁻</div>
    <div class="chemical c5">C₆H₁₂O₆</div>
    <div class="chemical c6">H₂O</div>

    <!-- โมเลกุล -->
    <div class="molecule">

        <div class="atom a1"></div>
        <div class="atom a2"></div>
        <div class="atom a3"></div>
        <div class="atom a4"></div>

        <div class="bond b1"></div>
        <div class="bond b2"></div>
        <div class="bond b3"></div>

    </div>

    <!-- เนื้อหาหลัก -->
    <div class="content">

        <div class="subtitle">
            CHEMISTRY LEARNING SYSTEM
        </div>

        <h1>CHEM GAME</h1>

        <div class="thai-title">
            เกมผจญภัยในโลกแห่งเคมี
        </div>

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

    </div>

    <div class="version">
        CHEM-GAME // VERSION 1.0
    </div>

    <div class="sdg">
        SDG 4 // QUALITY EDUCATION
    </div>

</div>


<script>

function login() {

    // แสดงข้อความเมื่อกด Login
    alert("เข้าสู่ระบบ Chem Game");

    // หากมีหน้าล็อกอิน สามารถเปลี่ยนเป็น
    // window.location.href = "login.html";

}

</script>

</body>
</html>
